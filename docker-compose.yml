# =============================================================================
# docker-compose.yml -- FULL-STACK mode: runs the ENTIRE platform in containers.
#
#   postgres + redis + api + ai-service + worker + web -- one command, no local
#   Go/Python/Node installs needed. This is the "runs anywhere" proof.
#
# ── USAGE ────────────────────────────────────────────────────────────────────
#
#   docker compose up --build        # build all 4 app images, start everything
#                                    #   web:        http://localhost:3000
#                                    #   api:        http://localhost:8080/health
#                                    #   ai-service: http://localhost:8000/docs
#   docker compose up -d --build     # same, but in the background
#   docker compose logs -f worker    # follow one service's logs
#   docker compose ps                # what's running / healthy
#   docker compose down              # stop everything (database data SURVIVES)
#   docker compose down -v           # stop everything AND wipe the database
#
#   First run only -- apply the DB migrations into the postgres container:
#     Get-Content apps/api/migrations/NNN_*.sql | docker exec -i ai-review-postgres psql -U review -d ai_review
#     (run each file 001..006 in order; or just use .\start.ps1 once, which does it)
#
# ── THIS FILE VS start.ps1 (pick ONE, they fight over ports 3000/8080/8000) ──
#
#   .\start.ps1                    DAILY DEV: Docker runs ONLY postgres + redis;
#                                  api/worker/ai-service/web run as local
#                                  processes (hot reload, fast restarts).
#   docker compose up --build      FULL-STACK DEMO: everything containerized.
#                                  Run `docker compose down` before switching
#                                  back to .\start.ps1.
#
#   Infra-only subset (what start.ps1 uses under the hood):
#     docker compose up -d postgres redis
#
# ── HOW SERVICES FIND EACH OTHER ─────────────────────────────────────────────
#
#   Compose puts all services on one private network where each is reachable
#   BY NAME (postgres, redis, api, ai-service) -- never "localhost" (that
#   means the container itself). The `environment:` blocks below override the
#   localhost URLs in the dev .env files; `env_file` still supplies GITHUB_*,
#   TOKEN_ENCRYPTION_KEY, etc. On a key conflict, `environment` wins.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-review-postgres
    environment:
      POSTGRES_USER: review
      POSTGRES_PASSWORD: reviewpass
      POSTGRES_DB: ai_review
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-review-redis
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    container_name: ai-review-api
    ports: ["8080:8080"]
    environment:
      # Service names, not localhost — containers reach each other by name.
      DATABASE_URL: postgres://review:reviewpass@postgres:5432/ai_review
      REDIS_URL: redis://redis:6379/0
      REDIS_ADDR: redis:6379
      PORT: "8080"
      # Shared API key protecting /api. Defaults so the api and web containers
      # get the SAME value; override by exporting API_KEY before compose up.
      API_KEY: ${API_KEY:-dev-local-api-key}
      # Only the dashboard origin may call the API from a browser.
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      # env_file below still provides GITHUB_* and TOKEN_ENCRYPTION_KEY;
      # `environment` wins over env_file on conflicts, which is what we want
      # for the URLs above (the .env files point at localhost for local dev).
    env_file: ./apps/api/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  ai-service:
    build: ./apps/ai-service
    container_name: ai-review-ai-service
    ports: ["8000:8000"]
    env_file: ./apps/ai-service/.env
    depends_on: [api]

  # Scale out with more workers: `docker compose up -d --scale worker=3`.
  # The LPUSH/BRPOP queue lets N workers share the queue safely -- no code
  # change needed. Remove `container_name` below first: fixed names stop
  # Compose from starting replicas.
  worker:
    build: ./apps/worker
    container_name: ai-review-worker
    environment:
      DATABASE_URL: postgres://review:reviewpass@postgres:5432/ai_review
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-service:8000
    env_file: ./apps/worker/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: ./apps/web
    container_name: ai-review-web
    ports: ["3000:3000"]
    environment:
      # Rewrites run server-side inside the Next container, so they must
      # target the API by its service name (see apps/web/next.config.ts).
      # The browser still only talks to localhost:3000 — no CORS change.
      API_INTERNAL_URL: http://api:8080
      # Same shared key the api expects; the Next proxy injects it on /api/*.
      # Default matches the api service so they line up out of the box.
      API_KEY: ${API_KEY:-dev-local-api-key}
    depends_on: [api]

volumes:
  postgres_data:
  redis_data:
