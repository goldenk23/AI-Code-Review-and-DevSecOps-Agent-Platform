# =============================================================================
# docker-compose.yml -- FULL-STACK mode: runs the ENTIRE platform in containers.
#
#   postgres + redis + api + ai-service + worker + web -- one command, no local
#   Go/Python/Node installs needed. This is the "runs anywhere" proof.
#
# ── USAGE ────────────────────────────────────────────────────────────────────
#
#   docker compose up --build        # build all 4 app images, start everything
#                                    #   web:        http://localhost:3000
#                                    #   api:        http://localhost:8080/health
#                                    #   ai-service: http://localhost:8000/docs
#   docker compose up -d --build     # same, but in the background
#   docker compose logs -f worker    # follow one service's logs
#   docker compose ps                # what's running / healthy
#   docker compose down              # stop everything (database data SURVIVES)
#   docker compose down -v           # stop everything AND wipe the database
#
#   Production HTTPS:
#     Copy deploy.env.example to .env, fill secrets, then run:
#     docker compose --profile production up -d --build
#   The one-shot migrate service applies all SQL files before API/workers start.
#
# ── THIS FILE VS start.ps1 (pick ONE, they fight over ports 3000/8080/8000) ──
#
#   .\start.ps1                    DAILY DEV: Docker runs ONLY postgres + redis;
#                                  api/worker/ai-service/web run as local
#                                  processes (hot reload, fast restarts).
#   docker compose up --build      FULL-STACK DEMO: everything containerized.
#                                  Run `docker compose down` before switching
#                                  back to .\start.ps1.
#
#   Infra-only subset (what start.ps1 uses under the hood):
#     docker compose up -d postgres redis
#
# ── HOW SERVICES FIND EACH OTHER ─────────────────────────────────────────────
#
#   Compose puts all services on one private network where each is reachable
#   BY NAME (postgres, redis, api, ai-service) -- never "localhost" (that
#   means the container itself). The `environment:` blocks below override the
#   localhost URLs in the dev .env files; `env_file` still supplies GITHUB_*,
#   TOKEN_ENCRYPTION_KEY, etc. On a key conflict, `environment` wins.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-review-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: review
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reviewpass}
      POSTGRES_DB: ai_review
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-review-redis
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://review:reviewpass@postgres:5432/ai_review}
    volumes:
      - ./apps/api/migrations:/migrations:ro
    command:
      - /bin/sh
      - -ec
      - |
        for file in /migrations/*.sql; do
          echo "Applying $${file}"
          psql "$${DATABASE_URL}" -v ON_ERROR_STOP=1 -f "$${file}"
        done
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: ./apps/api
    container_name: ai-review-api
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    environment:
      # Service names, not localhost — containers reach each other by name.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://review:reviewpass@postgres:5432/ai_review}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      WORKER_METRICS_URL: ${WORKER_METRICS_URL:-http://worker:9090/metrics}
      PORT: "8080"
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:3000/auth/github/callback}
      # Shared API key protecting /api. Defaults so the api and web containers
      # get the SAME value; override by exporting API_KEY before compose up.
      API_KEY: ${API_KEY:-dev-local-api-key}
      SESSION_SECRET: ${SESSION_SECRET:-dev-local-session-secret-change-me}
      ALLOWED_GITHUB_USERS: ${ALLOWED_GITHUB_USERS:-}
      # Only the dashboard origin may call the API from a browser.
      CORS_ALLOWED_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      # env_file below still provides GITHUB_* and TOKEN_ENCRYPTION_KEY;
      # `environment` wins over env_file on conflicts, which is what we want
      # for the URLs above (the .env files point at localhost for local dev).
    env_file: ./apps/api/.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  ai-service:
    build: ./apps/ai-service
    container_name: ai-review-ai-service
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    env_file: ./apps/ai-service/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      api: { condition: service_healthy }

  # Scale out with: `docker compose up -d --scale worker=3`.
  worker:
    build: ./apps/worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://review:reviewpass@postgres:5432/ai_review}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      API_BASE_URL: ${API_BASE_URL:-http://api:8080}
      API_KEY: ${API_KEY:-dev-local-api-key}
      RUN_REPOSITORY_TESTS: ${RUN_REPOSITORY_TESTS:-}
    expose: ["9090"]
    env_file: ./apps/worker/.env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      ai-service: { condition: service_healthy }

  web:
    build: ./apps/web
    container_name: ai-review-web
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_GITHUB_USERS: ${ALLOWED_GITHUB_USERS:-}
      # Rewrites run server-side inside the Next container, so they must
      # target the API by its service name (see apps/web/next.config.ts).
      # The browser still only talks to localhost:3000 — no CORS change.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
      # Same shared key the api expects; the Next proxy injects it on /api/*.
      # Default matches the api service so they line up out of the box.
      API_KEY: ${API_KEY:-dev-local-api-key}
      SESSION_SECRET: ${SESSION_SECRET:-dev-local-session-secret-change-me}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      api: { condition: service_healthy }

  production-check:
    image: alpine:3.20
    profiles: ["production"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:3000/auth/github/callback}
    command:
      - /bin/sh
      - -ec
      - |
        test "$${ENVIRONMENT}" = "production"
        test -n "$${APP_DOMAIN}" && test "$${APP_DOMAIN}" != "localhost"
        case "$${APP_ORIGIN}" in https://*) ;; *) exit 1 ;; esac
        case "$${GITHUB_CALLBACK_URL}" in https://*) ;; *) exit 1 ;; esac
    restart: "no"

  gateway:
    image: caddy:2.10.0-alpine
    profiles: ["production"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      production-check: { condition: service_completed_successfully }
      api: { condition: service_healthy }
      web: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
