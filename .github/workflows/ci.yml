name: CI

# Run on every push to any branch and every pull request.
on:
  push:
  pull_request:

jobs:
  # ---- Web: lint + build (Next.js 16 typecheck happens via `next build`) ----
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  # ---- Go API: vet + test ----
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - run: go vet ./...
        working-directory: apps/api
      - run: go test ./... -v
        working-directory: apps/api

  # ---- AI service: pytest ----
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest httpx
        working-directory: apps/ai-service
      - run: python -m pytest test_agent.py -v
        working-directory: apps/ai-service

  # ---- Worker: pytest (needs pytest + the worker's deps) ----
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirement.txt pytest
        working-directory: apps/worker
      - run: python -m pytest test_worker.py -v
        working-directory: apps/worker